version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nengtan-db
    restart: always
    environment:
      POSTGRES_DB: nengtan
      POSTGRES_USER: nengtan
      POSTGRES_PASSWORD: nengtan2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nengtan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nengtan-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://nengtan:nengtan2026@db:5432/nengtan
      SECRET_KEY: nengtan-secret-key-change-in-production-2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nengtan-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
